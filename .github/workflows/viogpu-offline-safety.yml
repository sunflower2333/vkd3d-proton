name: VIOGPU offline safety
on:
  push:
    branches: [work/native-offline-safety-20260915]
  pull_request:
    paths: ['libs/vkd3d-umd/**', 'tools/test-umd-root-descriptors.sh', '.github/workflows/viogpu-offline-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root-descriptors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute production binding bodies under sanitizers without Vulkan
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-revision.txt
          bash tools/test-umd-root-descriptors.sh 2>&1 | tee root-descriptors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-descriptors-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            root-descriptors.txt
            source-revision.txt
          if-no-files-found: error
          retention-days: 7
