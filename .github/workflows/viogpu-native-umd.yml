name: Native VIOGPU D3D12 bridge
on:
  push:
    branches: [viogpu-native-d3d12-umd, viogpu-native-d3d12-descriptors, viogpu-native-runtime-entry-20260911]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build wine64-tools libwine-dev glslang-tools mesa-vulkan-drivers
      - run: meson setup build-umd --buildtype debugoptimized -Denable_umd_bridge=true -Denable_umd_bridge_tests=true
      - run: meson compile -C build-umd -j 3 vkd3d-umd-backend-test
      - name: Execute real backend on CPU Vulkan, never report GPU acceptance
        shell: bash
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          if [ ! -f "$VK_DRIVER_FILES" ]; then export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json; fi
          timeout 90 build-umd/libs/vkd3d-umd/vkd3d-umd-backend-test
  windows:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            msvc: x64_arm64
          - arch: x64
            msvc: x64
          - arch: x86
            msvc: x64_x86
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git submodule update --init --recursive --depth 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare upstream build tools
        shell: pwsh
        run: |
          choco install strawberryperl -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://raw.githubusercontent.com/HansKristian-Work/vkd3d-proton-ci/9e54d0ea518003b6da3f1600c010840a5921e0aa/glslangValidator.exe' -OutFile C:\Strawberry\c\bin\glslangValidator.exe
          'C:\Strawberry\c\bin' | Out-File $env:GITHUB_PATH -Append
          pip install meson ninja
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build WDK bridge and check ABI
        shell: pwsh
        run: ./tools/build-windows-umd.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vkd3d-native-ddi-${{ matrix.arch }}
          path: |
            build-umd-${{ matrix.arch }}/package/
            build-umd-${{ matrix.arch }}/meson-logs/
            build-umd-${{ matrix.arch }}/libs/vkd3d-umd/runtime-*.txt
  arm64-runtime:
    needs: windows
    if: ${{ !cancelled() }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: vkd3d-native-ddi-arm64
          path: candidate
      - name: Execute actual ARM64 lifecycle and semantic negative controls
        shell: pwsh
        run: ./tools/test-windows-umd-runtime.ps1 -Executable candidate/package/vkd3d-umd-runtime-test.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vkd3d-runtime-arm64-validation
          path: candidate/package/runtime-*.txt
